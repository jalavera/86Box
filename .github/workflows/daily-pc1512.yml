name: PC1512 daily builds

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/daily-pc1512.yml
  schedule:
    # Daily lightweight check; the build gate below runs every 72 hours.
    # 03:17 UTC avoids the top of the hour and is a relatively quiet period.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: pc1512-daily-builds
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Check three-day build interval
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.gate.outputs.run_build }}
    steps:
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            run_build=true
          else
            # Anchor the cadence on 2026-11-20: builds then repeat every 72 hours.
            today=$(date -u +%F)
            today_epoch=$(date -u -d "$today" +%s)
            anchor_epoch=$(date -u -d "2026-11-20" +%s)
            days=$(( (today_epoch - anchor_epoch) / 86400 ))
            if (( days >= 0 && days % 3 == 0 )); then
              run_build=true
            else
              run_build=false
            fi
          fi
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"

  sync:
    name: Update private branch from upstream
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      official_build: ${{ steps.metadata.outputs.official_build }}
      release_date: ${{ steps.metadata.outputs.release_date }}
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          ref: pc1512-vram-nomirror
          fetch-depth: 0
      - name: Merge latest official 86Box
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          git remote add upstream https://github.com/86Box/86Box.git
          git fetch upstream master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff upstream/master
          # Keep this fork branch's CI definitions: the GitHub App token
          # is intentionally not granted the separate workflows permission.
          rm -rf .github/workflows
          git checkout "$BASE_SHA" -- .github/workflows
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "Preserve fork workflow configuration"
          fi
      - name: Push updated branch
        id: push
        run: |
          git push origin HEAD:pc1512-vram-nomirror
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read official 86Box build number and release date
        id: metadata
        shell: bash
        run: |
          official_build=$(curl -fsSL https://ci.86box.net/job/86Box/lastSuccessfulBuild/buildNumber | tr -d '\\r\\n')
          if [[ ! "$official_build" =~ ^[0-9]+$ ]]; then
            echo "Invalid official Jenkins build number: $official_build" >&2
            exit 1
          fi
          release_date=$(date -u +%Y%m%d)
          echo "official_build=$official_build" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "Using official 86Box build #$official_build; release date $release_date"

  build:
    name: Build ${{ matrix.label }}
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            asset: Linux.x86_64
            os: ubuntu-26.04
            platform: linux
          - label: Linux ARM64
            asset: Linux.ARM64
            os: ubuntu-26.04-arm
            platform: linux
          - label: macOS Apple Silicon
            asset: macOS.AppleSilicon
            os: macos-15
            platform: macos
          - label: macOS Intel
            asset: macOS.Intel
            os: macos-15-intel
            platform: macos
          - label: Windows x64
            asset: Windows.x64
            os: windows-2022
            platform: windows
            msystem: UCRT64
          - label: Windows ARM64
            asset: Windows.ARM64
            os: windows-11-arm
            platform: windows
            msystem: CLANGARM64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - name: Checkout updated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake pkg-config \
            libfreetype-dev libgles2-mesa-dev libsdl3-dev libpng-dev \
            librtmidi-dev libopenal-dev libslirp-dev libfluidsynth-dev \
            libvdeplug-dev libserialport-dev libzstd-dev libarchive-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev qttranslations5-l10n \
            libevdev-dev libxkbcommon-x11-dev

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install sdl3 rtmidi openal-soft fluidsynth readline libslirp vde libserialport vulkan-headers zstd libarchive qt@5

      - name: Prepare Windows MSYS2
        if: matrix.platform == 'windows'
        uses: ./.github/actions/setup-msys2
        with:
          msystem: ${{ matrix.msystem }}
          qt6: false

      - name: Configure
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:$(brew --prefix openal-soft)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            cmake -S . -B build --preset development -D QT=on -D USE_QT6=off -D USE_SDL_SHADER=off -D Qt5_ROOT="$(brew --prefix qt@5)" -D Qt5LinguistTools_ROOT="$(brew --prefix qt@5)" -D LibArchive_ROOT="$(brew --prefix libarchive)" -D OPENAL_INCLUDE_DIR="$(brew --prefix openal-soft)/include" -D OPENAL_LIBRARY="$(brew --prefix openal-soft)/lib/libopenal.dylib"
          else
            cmake -S . -B build --preset development -D QT=on -D USE_QT6=off -D USE_SDL_SHADER=off
          fi

      - name: Compile
        run: cmake --build build --parallel

      - name: Install package
        run: |
          cmake --install build --prefix package
          mkdir -p dist
          cmake -E tar cf "dist/86Box-b${{ needs.sync.outputs.official_build }}-jalavera-${{ needs.sync.outputs.release_date }}-${{ matrix.asset }}.zip" --format=zip package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 86Box-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish binary to daily GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          tag="daily-${{ needs.sync.outputs.release_date }}-${{ github.run_number }}"
          title="86Box daily build ${{ needs.sync.outputs.release_date }}"
          notes="Daily build of jalavera/86Box branch pc1512-vram-nomirror, synchronized with upstream 86Box/master. Source: $SOURCE_SHA"
          # All matrix jobs share one release. The first creates it; the
          # others reuse it and upload their own uniquely named asset.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --target "$SOURCE_SHA" --notes "$notes" || \
            gh release view "$tag" --repo "$GITHUB_REPOSITORY"
          # Convert the previous daily prerelease to a normal release once.
          gh release edit daily-20261118-12 --prerelease=false --repo "$GITHUB_REPOSITORY" || true
          gh release edit "$tag" --prerelease=false --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
